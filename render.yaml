databases:
  - name: rookroom-db
    plan: free
services:
  - type: web
    name: rookroom-3d
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn rookroom.wsgi
    envVars:
      - key: ROOKROOM_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rookroom-db
          property: connectionString
